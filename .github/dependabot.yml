# Dependabot configuration for flutter-wipe
# This file configures Dependabot to check for dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

    labels:
      - "dependencies"
      - "rust"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    commit-message:
      prefix: "cargo"
      include: "scope"
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
