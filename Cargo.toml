
[package]
name = "flutter-wipe"
authors = ["Aman Sikarwar <amansikarwar@gmail.com>"]
description = "A tool to clean Flutter projects by removing build artifacts and other unnecessary files."
license = "MIT"
repository = "https://github.com/amansikarwar/flutter-wipe"
categories = ["development", "flutter", "cleaning", "command-line-utilities"]
version = "0.3.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
walkdir = "2.5.0"
indicatif = "0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
colored = "3.0.0"
fs_extra = "1.3.0"
human_bytes = "0.4.3"
toml = "0.9.8"
rayon = "1.10.0"
crossbeam-channel = "0.5.13"
num_cpus = "1.16.0"
tokio = { version = "1.49.0", features = ["full"] }
